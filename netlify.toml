[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Keep HTML fresh while allowing long caching for hashed assets.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Safe fallback for direct URL hits / client-side navigation.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
